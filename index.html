<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Frame AR</title>
    
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0c0d12;
            color: #ffffff;
            overflow: hidden;
        }

        .video-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 0;
            opacity: 0; /* Keep raw camera hidden, only render on canvas */
            pointer-events: none;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 5;
        }

        /* Clean HUD Overlay */
        #hud {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .hud-item {
            background: rgba(12, 13, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            min-width: 150px;
            backdrop-filter: blur(8px);
        }

        .hud-item span.val {
            color: #ffffff;
            font-weight: bold;
        }

        /* Clean Start Overlay */
        #startOverlay {
            position: absolute;
            inset: 0;
            background: #0c0d12;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .start-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .start-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 32px;
            letter-spacing: 1px;
        }

        .start-btn {
            padding: 12px 28px;
            font-size: 11px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Start Overlay -->
    <div id="startOverlay">
        <h1 class="start-title">CHROMA FRAME</h1>
        <p class="start-desc">Allow camera access and click to begin the experience</p>
        <button class="start-btn" id="startBtn">Enter Experience</button>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div id="hud" class="hidden">
        <div class="hud-item">
            <span>Hands Detected</span>
            <span class="val" id="ui-hands">0</span>
        </div>
        <div class="hud-item">
            <span>Frame State</span>
            <span class="val" id="ui-mode">Normal</span>
        </div>
        <div class="hud-item">
            <span>System FPS</span>
            <span class="val" id="ui-fps">0</span>
        </div>
    </div>

<script>
/** 
 * GLOBALS & CONFIG
 */
const videoElement = document.querySelector('.input_video');
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');

// Offscreen canvas for downsampling video frames
const offscreenCanvas = document.createElement('canvas');
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

let width = window.innerWidth;
let height = window.innerHeight;

// Grid settings - 280 columns for sharp halftone resolution
const targetGridWidth = 280;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();
let currentFps = 0;

let currentHands = []; // Latest MediaPipe hands data

// UI Elements
const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiMode = document.getElementById('ui-mode');

/**
 * INITIALIZATION
 */
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    mainCanvas.width = width;
    mainCanvas.height = height;
    
    const dotSpacing = Math.ceil(width / targetGridWidth);
    const smallWidth = Math.floor(width / dotSpacing);
    const smallHeight = Math.floor(height / dotSpacing);
    
    offscreenCanvas.width = smallWidth;
    offscreenCanvas.height = smallHeight;
}
window.addEventListener('resize', resize);
resize();

// Start button click triggers camera initialization
document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

/**
 * MATH & UTILITIES
 */
function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function mapToCanvas(point) {
    return { x: point.x * width, y: point.y * height };
}

/**
 * MAIN RENDER LOOP
 */
function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        currentFps = framesThisSecond;
        uiFps.innerText = currentFps;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    // Clear the canvas fully each frame (no motion blur)
    ctx.clearRect(0, 0, width, height);

    // 1. Draw base camera feed with a slight saturation boost
    if (videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
        ctx.filter = 'saturate(1.35) contrast(1.05)';
        ctx.drawImage(videoElement, 0, 0, width, height);
        ctx.filter = 'none';
    } else {
        ctx.fillStyle = '#1e222b';
        ctx.fillRect(0, 0, width, height);
    }

    // Determine if we have two hands to form the L-Frame quad
    let hasFrame = false;
    let quadPoints = [];

    if (currentHands.length >= 2) {
        const h1 = currentHands[0];
        const h2 = currentHands[1];
        
        // Get thumb tips (4) and index finger tips (8)
        const pt1_thumb = mapToCanvas(h1[4]);
        const pt1_index = mapToCanvas(h1[8]);
        const pt2_thumb = mapToCanvas(h2[4]);
        const pt2_index = mapToCanvas(h2[8]);

        if (pt1_thumb && pt1_index && pt2_thumb && pt2_index) {
            // Keep anatomical order: index1 -> thumb1 -> thumb2 -> index2 -> index1
            // This naturally crosses when one hand is flipped upside down, forming a double triangle.
            quadPoints = [pt1_index, pt1_thumb, pt2_thumb, pt2_index];
            hasFrame = true;
        }
    }

    uiMode.innerText = hasFrame ? "L-Frame" : "Normal";
    uiHands.innerText = currentHands.length;

    // 2. If L-Frame is active, draw the yellow clipped background (`#f5b813`) and run halftone inside
    if (hasFrame && quadPoints.length === 4 && videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
        ctx.save();
        
        // Create clipping path of the quad/double triangle shape
        ctx.beginPath();
        ctx.moveTo(quadPoints[0].x, quadPoints[0].y);
        for (let i = 1; i < quadPoints.length; i++) {
            ctx.lineTo(quadPoints[i].x, quadPoints[i].y);
        }
        ctx.closePath();
        
        // Fill base yellow area
        ctx.fillStyle = '#f5b813';
        ctx.fill();
        
        // Apply clipping mask
        ctx.clip();

        // Calculate bounding box of the quad to optimize dot calculation
        let minX = Math.min(quadPoints[0].x, quadPoints[1].x, quadPoints[2].x, quadPoints[3].x);
        let maxX = Math.max(quadPoints[0].x, quadPoints[1].x, quadPoints[2].x, quadPoints[3].x);
        let minY = Math.min(quadPoints[0].y, quadPoints[1].y, quadPoints[2].y, quadPoints[3].y);
        let maxY = Math.max(quadPoints[0].y, quadPoints[1].y, quadPoints[2].y, quadPoints[3].y);
        
        minX = Math.max(0, minX);
        maxX = Math.min(width, maxX);
        minY = Math.max(0, minY);
        maxY = Math.min(height, maxY);

        // Draw offscreen downsampled image
        offscreenCtx.drawImage(videoElement, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
        
        const smallW = offscreenCanvas.width;
        const smallH = offscreenCanvas.height;
        const imgData = offscreenCtx.getImageData(0, 0, smallW, smallH).data;
        
        const dotSpacing = Math.ceil(width / targetGridWidth);
        ctx.fillStyle = '#1a3683'; // Deep Indigo Blue dots

        const startX = Math.floor(minX / dotSpacing);
        const endX = Math.ceil(maxX / dotSpacing);
        const startY = Math.floor(minY / dotSpacing);
        const endY = Math.ceil(maxY / dotSpacing);

        for (let y = startY; y < endY; y++) {
            if (y < 0 || y >= smallH) continue;
            for (let x = startX; x < endX; x++) {
                if (x < 0 || x >= smallW) continue;
                
                const idx = (y * smallW + x) * 4;
                const r = imgData[idx];
                const g = imgData[idx+1];
                const b = imgData[idx+2];
                
                // Calculate brightness (0 = black, 1 = white)
                let brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                
                // High-contrast adjustment inside yellow section
                const contrastFactor = 2.4;
                brightness = (brightness - 0.5) * contrastFactor + 0.5;
                brightness = Math.max(0, Math.min(1, brightness));

                // Darker regions produce larger halftone dots
                const maxRadius = (dotSpacing / 2) * 1.35;
                const radius = (1 - brightness) * maxRadius;
                
                if (radius > 0.4) {
                    const cx = x * dotSpacing + dotSpacing / 2;
                    const cy = y * dotSpacing + dotSpacing / 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        ctx.restore();
    }

    // 3. Draw simple hand skeleton lines (only Index and Thumb)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    currentHands.forEach(hand => {
        const wrist = mapToCanvas(hand[0]);

        // Thumb: 0 -> 1 -> 2 -> 3 -> 4
        ctx.beginPath();
        ctx.moveTo(wrist.x, wrist.y);
        for (let i = 1; i <= 4; i++) {
            const pt = mapToCanvas(hand[i]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        // Index: 0 -> 5 -> 6 -> 7 -> 8
        ctx.beginPath();
        ctx.moveTo(wrist.x, wrist.y);
        for (let i = 5; i <= 8; i++) {
            const pt = mapToCanvas(hand[i]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        
        // Connect tips with a clean thin dashed/subtle line to indicate the finger bounds
        ctx.beginPath();
        const thumbTip = mapToCanvas(hand[4]);
        const indexTip = mapToCanvas(hand[8]);
        ctx.moveTo(thumbTip.x, thumbTip.y);
        ctx.lineTo(indexTip.x, indexTip.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Reset stroke color back to white for the next hand
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2.5;
    });

    // 4. Draw clean thin line around the frame area if active
    if (hasFrame && quadPoints.length === 4) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(quadPoints[0].x, quadPoints[0].y);
        for (let i = 1; i < quadPoints.length; i++) {
            ctx.lineTo(quadPoints[i].x, quadPoints[i].y);
        }
        ctx.closePath();
        ctx.stroke();
    }
}

/**
 * MEDIAPIPE INITIALIZATION
 */
function initMediaPipe() {
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1, 
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        currentHands = results.multiHandLandmarks || [];
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720,
        facingMode: 'user'
    });
    
    camera.start();
}
</script>
</body>
</html>
