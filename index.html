<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chroma Frame AR</title>
    
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0d12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0c0d12;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 0;
            opacity: 0; /* Keep raw camera hidden, only render on canvas */
            pointer-events: none;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror */
            z-index: 5;
        }

        /* Top Controls (Fullscreen and Fit/Fill buttons) */
        #controls {
            position: absolute;
            top: max(16px, env(safe-area-inset-top, 16px));
            left: max(16px, env(safe-area-inset-left, 16px));
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: rgba(12, 13, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .control-btn:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .control-btn:active {
            transform: scale(0.96);
        }

        /* Clean HUD Overlay */
        #hud {
            position: absolute;
            top: max(16px, env(safe-area-inset-top, 16px));
            right: max(16px, env(safe-area-inset-right, 16px));
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .hud-item {
            background: rgba(12, 13, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            min-width: 125px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-item span.val {
            color: #ffffff;
            font-weight: bold;
        }

        /* Clean Start Overlay */
        #startOverlay {
            position: absolute;
            inset: 0;
            background: #0c0d12;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .start-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .start-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 32px;
            letter-spacing: 1px;
            max-width: 320px;
            line-height: 1.5;
        }

        .start-btn {
            padding: 12px 28px;
            font-size: 11px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .start-btn:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- Start Overlay -->
    <div id="startOverlay">
        <h1 class="start-title">CHROMA FRAME</h1>
        <p class="start-desc">Allow camera access and click to begin the experience</p>
        <button class="start-btn" id="startBtn">Enter Experience</button>
    </div>

    <!-- UI Controls (Fullscreen & Fit/Fill buttons) -->
    <div id="controls" class="hidden">
        <button id="fullscreenBtn" class="control-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
            <svg id="fsIconExpand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <svg id="fsIconCompress" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
            </svg>
            <span id="fsText">FULL</span>
        </button>
        <button id="fitBtn" class="control-btn" aria-label="Toggle Fit Mode" title="Toggle Fit / Fill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="3" y1="15" x2="21" y2="15"/>
            </svg>
            <span id="fitText">FIT</span>
        </button>
    </div>

    <div class="video-container">
        <video class="input_video" autoplay playsinline muted></video>
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div id="hud" class="hidden">
        <div class="hud-item">
            <span>Hands</span>
            <span class="val" id="ui-hands">0</span>
        </div>
        <div class="hud-item">
            <span>State</span>
            <span class="val" id="ui-mode">Normal</span>
        </div>
        <div class="hud-item">
            <span>FPS</span>
            <span class="val" id="ui-fps">0</span>
        </div>
    </div>

<script>
/** 
 * GLOBALS & CONFIG
 */
const videoElement = document.querySelector('.input_video');
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');

// Offscreen canvas for downsampling video frames
const offscreenCanvas = document.createElement('canvas');
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

let width = window.innerWidth;
let height = window.innerHeight;

// Grid settings - target columns for halftone resolution
const targetGridWidth = 240;
let dotSpacing = 7;

// Default fitMode:
// On portrait screens (phones), default to 'fit' so the user is never cropped or zoomed in!
let fitMode = (window.innerHeight > window.innerWidth) ? 'fit' : 'fill';

// Aspect ratio / Projection parameters
let renderWidth = width;
let renderHeight = height;
let offsetX = 0;
let offsetY = 0;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();
let currentFps = 0;

let currentHands = []; // Latest MediaPipe hands data
let handsDetector = null;
let isSendingFrame = false;

// UI Elements
const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiMode = document.getElementById('ui-mode');
const controls = document.getElementById('controls');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const fsIconExpand = document.getElementById('fsIconExpand');
const fsIconCompress = document.getElementById('fsIconCompress');
const fsText = document.getElementById('fsText');
const fitBtn = document.getElementById('fitBtn');
const fitText = document.getElementById('fitText');

/**
 * PROJECTION / ASPECT-RATIO CALCULATION
 * Computes exact render bounds based on 'fit' (zero zoom) or 'fill' (edge-to-edge cover)
 */
function updateProjection() {
    const vWidth = videoElement.videoWidth || (window.innerHeight > window.innerWidth ? 720 : 1280);
    const vHeight = videoElement.videoHeight || (window.innerHeight > window.innerWidth ? 1280 : 720);
    const canvasAspect = width / height;
    const videoAspect = vWidth / vHeight;

    if (fitMode === 'fill') {
        // COVER: Fills the entire screen
        if (canvasAspect > videoAspect) {
            renderWidth = width;
            renderHeight = width / videoAspect;
            offsetX = 0;
            offsetY = (height - renderHeight) / 2;
        } else {
            renderHeight = height;
            renderWidth = height * videoAspect;
            offsetX = (width - renderWidth) / 2;
            offsetY = 0;
        }
    } else {
        // FIT: Shows the entire camera view without ANY zooming or cropping!
        if (canvasAspect > videoAspect) {
            // Screen is wider than video (pillars on sides)
            renderHeight = height;
            renderWidth = height * videoAspect;
            offsetX = (width - renderWidth) / 2;
            offsetY = 0;
        } else {
            // Screen is taller than video (e.g. phone in portrait: bars on top & bottom)
            renderWidth = width;
            renderHeight = width / videoAspect;
            offsetX = 0;
            offsetY = (height - renderHeight) / 2;
        }
    }
}

/**
 * INITIALIZATION & RESIZING
 */
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    mainCanvas.width = width;
    mainCanvas.height = height;

    updateProjection();
    
    // Adaptive dotSpacing ensuring high resolution and smooth 60 FPS on any phone or desktop
    dotSpacing = Math.max(5, Math.ceil(width / targetGridWidth));
    const smallWidth = Math.ceil(width / dotSpacing);
    const smallHeight = Math.ceil(height / dotSpacing);
    
    offscreenCanvas.width = smallWidth;
    offscreenCanvas.height = smallHeight;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/**
 * FIT MODE TOGGLE
 */
function updateFitUI() {
    fitText.innerText = fitMode.toUpperCase();
}
updateFitUI();

fitBtn.addEventListener('click', () => {
    fitMode = (fitMode === 'fit') ? 'fill' : 'fit';
    updateFitUI();
    updateProjection();
});

/**
 * FULLSCREEN TOGGLE
 */
function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
}

function updateFullscreenUI() {
    if (isFullscreen()) {
        fsIconExpand.classList.add('hidden');
        fsIconCompress.classList.remove('hidden');
        fsText.innerText = 'EXIT';
    } else {
        fsIconExpand.classList.remove('hidden');
        fsIconCompress.classList.add('hidden');
        fsText.innerText = 'FULL';
    }
}

function toggleFullScreen() {
    const doc = document;
    const docEl = document.documentElement;

    if (!isFullscreen()) {
        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
        if (req) {
            req.call(docEl).catch(err => {
                console.warn('Fullscreen request failed:', err);
            });
        }
    } else {
        const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
        if (exit) {
            exit.call(doc).catch(err => {
                console.warn('Exit fullscreen failed:', err);
            });
        }
    }
}

fullscreenBtn.addEventListener('click', toggleFullScreen);
document.addEventListener('fullscreenchange', () => { updateFullscreenUI(); resize(); });
document.addEventListener('webkitfullscreenchange', () => { updateFullscreenUI(); resize(); });
document.addEventListener('mozfullscreenchange', () => { updateFullscreenUI(); resize(); });
document.addEventListener('MSFullscreenChange', () => { updateFullscreenUI(); resize(); });

// Start button click triggers camera initialization
document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    controls.classList.remove('hidden');
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

/**
 * MATH & UTILITIES
 */
function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

// Maps normalized MediaPipe landmark coordinates directly to the canvas coordinate space
function mapToCanvas(point) {
    return {
        x: offsetX + point.x * renderWidth,
        y: offsetY + point.y * renderHeight
    };
}

/**
 * MAIN RENDER LOOP
 */
function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        currentFps = framesThisSecond;
        uiFps.innerText = currentFps;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    // Keep projection synced with actual video stream dimensions
    if (videoElement.readyState >= videoElement.HAVE_METADATA) {
        updateProjection();
    }

    // Send frame to MediaPipe if ready
    if (!isSendingFrame && handsDetector && videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
        isSendingFrame = true;
        handsDetector.send({ image: videoElement })
            .catch(err => console.error(err))
            .finally(() => { isSendingFrame = false; });
    }

    // Clear the canvas fully each frame (no motion blur)
    ctx.clearRect(0, 0, width, height);

    // 1. Draw base camera feed
    if (videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
        // If in FIT mode on a phone screen, render an ambient blurred background in the margins
        if (fitMode === 'fit' && (offsetX > 0 || offsetY > 0)) {
            ctx.save();
            ctx.filter = 'blur(40px) brightness(0.25) saturate(1.2)';
            ctx.drawImage(videoElement, 0, 0, width, height);
            ctx.restore();
        }

        // Draw crisp main video feed
        ctx.filter = 'saturate(1.35) contrast(1.05)';
        ctx.drawImage(videoElement, offsetX, offsetY, renderWidth, renderHeight);
        ctx.filter = 'none';
    } else {
        ctx.fillStyle = '#0c0d12';
        ctx.fillRect(0, 0, width, height);
    }

    // Determine if we have two hands to form the L-Frame quad
    let hasFrame = false;
    let quadPoints = [];

    if (currentHands.length >= 2) {
        const h1 = currentHands[0];
        const h2 = currentHands[1];
        
        // Get thumb tips (4) and index finger tips (8) mapped to canvas coordinates
        const pt1_thumb = mapToCanvas(h1[4]);
        const pt1_index = mapToCanvas(h1[8]);
        const pt2_thumb = mapToCanvas(h2[4]);
        const pt2_index = mapToCanvas(h2[8]);

        if (pt1_thumb && pt1_index && pt2_thumb && pt2_index) {
            // Keep anatomical order: index1 -> thumb1 -> thumb2 -> index2 -> index1
            // Naturally crosses into a double triangle when one hand is flipped upside down
            quadPoints = [pt1_index, pt1_thumb, pt2_thumb, pt2_index];
            hasFrame = true;
        }
    }

    uiMode.innerText = hasFrame ? "L-Frame" : "Normal";
    uiHands.innerText = currentHands.length;

    // 2. If L-Frame is active, clip the yellow background (`#f5b813`) and render high-contrast halftone inside
    if (hasFrame && quadPoints.length === 4 && videoElement.readyState >= videoElement.HAVE_CURRENT_DATA) {
        ctx.save();
        
        // Create clipping path of the quad/double triangle shape
        ctx.beginPath();
        ctx.moveTo(quadPoints[0].x, quadPoints[0].y);
        for (let i = 1; i < quadPoints.length; i++) {
            ctx.lineTo(quadPoints[i].x, quadPoints[i].y);
        }
        ctx.closePath();
        
        // Fill base yellow area
        ctx.fillStyle = '#f5b813';
        ctx.fill();
        
        // Apply clipping mask
        ctx.clip();

        // Calculate bounding box of the quad to optimize dot calculation
        let minX = Math.min(quadPoints[0].x, quadPoints[1].x, quadPoints[2].x, quadPoints[3].x);
        let maxX = Math.max(quadPoints[0].x, quadPoints[1].x, quadPoints[2].x, quadPoints[3].x);
        let minY = Math.min(quadPoints[0].y, quadPoints[1].y, quadPoints[2].y, quadPoints[3].y);
        let maxY = Math.max(quadPoints[0].y, quadPoints[1].y, quadPoints[2].y, quadPoints[3].y);
        
        minX = Math.max(0, minX);
        maxX = Math.min(width, maxX);
        minY = Math.max(0, minY);
        maxY = Math.min(height, maxY);

        // Draw offscreen downsampled image with exact positioning
        offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        offscreenCtx.drawImage(
            videoElement, 
            offsetX / dotSpacing, 
            offsetY / dotSpacing, 
            renderWidth / dotSpacing, 
            renderHeight / dotSpacing
        );
        
        const smallW = offscreenCanvas.width;
        const smallH = offscreenCanvas.height;
        const imgData = offscreenCtx.getImageData(0, 0, smallW, smallH).data;
        
        ctx.fillStyle = '#1a3683'; // Deep Indigo Blue dots

        const startX = Math.floor(minX / dotSpacing);
        const endX = Math.ceil(maxX / dotSpacing);
        const startY = Math.floor(minY / dotSpacing);
        const endY = Math.ceil(maxY / dotSpacing);

        for (let y = startY; y < endY; y++) {
            if (y < 0 || y >= smallH) continue;
            for (let x = startX; x < endX; x++) {
                if (x < 0 || x >= smallW) continue;
                
                const idx = (y * smallW + x) * 4;
                const r = imgData[idx];
                const g = imgData[idx+1];
                const b = imgData[idx+2];
                
                // Calculate brightness (0 = black, 1 = white)
                let brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                
                // High-contrast adjustment inside yellow section
                const contrastFactor = 2.4;
                brightness = (brightness - 0.5) * contrastFactor + 0.5;
                brightness = Math.max(0, Math.min(1, brightness));

                // Darker regions produce larger halftone dots
                const maxRadius = (dotSpacing / 2) * 1.35;
                const radius = (1 - brightness) * maxRadius;
                
                if (radius > 0.4) {
                    const cx = x * dotSpacing + dotSpacing / 2;
                    const cy = y * dotSpacing + dotSpacing / 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        ctx.restore();
    }

    // 3. Draw simple hand skeleton lines (only Index and Thumb)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    currentHands.forEach(hand => {
        const wrist = mapToCanvas(hand[0]);

        // Thumb: 0 -> 1 -> 2 -> 3 -> 4
        ctx.beginPath();
        ctx.moveTo(wrist.x, wrist.y);
        for (let i = 1; i <= 4; i++) {
            const pt = mapToCanvas(hand[i]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        // Index: 0 -> 5 -> 6 -> 7 -> 8
        ctx.beginPath();
        ctx.moveTo(wrist.x, wrist.y);
        for (let i = 5; i <= 8; i++) {
            const pt = mapToCanvas(hand[i]);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        
        // Connect tips with a subtle dashed line to indicate finger bounds
        ctx.beginPath();
        const thumbTip = mapToCanvas(hand[4]);
        const indexTip = mapToCanvas(hand[8]);
        ctx.moveTo(thumbTip.x, thumbTip.y);
        ctx.lineTo(indexTip.x, indexTip.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Reset stroke color back to white for the next hand
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2.5;
    });

    // 4. Draw clean thin line around the frame area if active
    if (hasFrame && quadPoints.length === 4) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(quadPoints[0].x, quadPoints[0].y);
        for (let i = 1; i < quadPoints.length; i++) {
            ctx.lineTo(quadPoints[i].x, quadPoints[i].y);
        }
        ctx.closePath();
        ctx.stroke();
    }
}

/**
 * CAMERA & MEDIAPIPE INITIALIZATION
 */
async function startCamera() {
    const isPortrait = window.innerHeight > window.innerWidth;
    
    // Request flexible constraints suitable for mobile phones in portrait & desktop
    const constraintsList = [
        {
            audio: false,
            video: {
                facingMode: 'user',
                width: { ideal: isPortrait ? 720 : 1280 },
                height: { ideal: isPortrait ? 1280 : 720 },
                aspectRatio: { ideal: isPortrait ? (9 / 16) : (16 / 9) }
            }
        },
        {
            audio: false,
            video: { facingMode: 'user' }
        },
        {
            audio: false,
            video: true
        }
    ];

    let stream = null;
    for (const c of constraintsList) {
        try {
            stream = await navigator.mediaDevices.getUserMedia(c);
            if (stream) break;
        } catch (e) {
            console.warn('Constraint fallback:', e);
        }
    }

    if (!stream) {
        alert('Camera access denied or unavailable. Please ensure permissions are granted.');
        return;
    }

    videoElement.srcObject = stream;
    await videoElement.play();
    updateProjection();
}

function initMediaPipe() {
    handsDetector = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    handsDetector.setOptions({
        maxNumHands: 2,
        modelComplexity: 1, 
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    handsDetector.onResults((results) => {
        currentHands = results.multiHandLandmarks || [];
    });

    startCamera();
}
</script>
</body>
</html>
